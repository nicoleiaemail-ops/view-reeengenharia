<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#27272A" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#27272A" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#27272A" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#27272A" stroke-width="1"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="#FAFAFA"/>

  <!-- Logo mark -->
  <rect x="96" y="220" width="48" height="48" rx="6" fill="#FAFAFA"/>
  <text x="108" y="254" font-family="monospace" font-size="24" font-weight="900" fill="#09090B">V</text>

  <!-- Brand name -->
  <text x="96" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#FAFAFA" letter-spacing="12">VIEW</text>

  <!-- Tagline -->
  <text x="96" y="388" font-family="Arial, sans-serif" font-size="18" fill="#71717A" letter-spacing="6">IA · PROCESSOS · DADOS</text>

  <!-- Divider -->
  <rect x="96" y="415" width="80" height="2" fill="#FAFAFA"/>

  <!-- Description -->
  <text x="96" y="450" font-family="Arial, sans-serif" font-size="22" fill="#A1A1AA">Visibilidade e controle operacional para empresas</text>

  <!-- Domain -->
  <text x="96" y="540" font-family="Arial, sans-serif" font-size="16" fill="#52525B" letter-spacing="2">reengenhariaview.com.br</text>

  <!-- Right side decorative element -->
  <rect x="900" y="180" width="200" height="2" fill="#27272A"/>
  <rect x="960" y="220" width="140" height="2" fill="#27272A"/>
  <rect x="920" y="260" width="180" height="2" fill="#27272A"/>
  <rect x="940" y="300" width="160" height="2" fill="#27272A"/>
  <rect x="900" y="340" width="200" height="2" fill="#27272A"/>
  <rect x="970" y="380" width="130" height="2" fill="#27272A"/>
  <rect x="930" y="420" width="170" height="2" fill="#27272A"/>

  <!-- Dot accent -->
  <circle cx="1060" cy="315" r="40" fill="none" stroke="#27272A" stroke-width="2"/>
  <circle cx="1060" cy="315" r="6" fill="#FAFAFA"/>
</svg>
